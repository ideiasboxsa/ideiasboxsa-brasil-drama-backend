services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brasil_drama
      POSTGRES_USER: brasil_drama
      POSTGRES_PASSWORD: brasil_drama
    ports:
      - "5432:5432"
    volumes:
      - brasil_drama_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brasil_drama -d brasil_drama"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/brasil_drama
      DB_USER: brasil_drama
      DB_PASSWORD: brasil_drama
      LIQUIBASE_CONTEXTS: base,dev
      # JwtService não tem mais valor padrão: a aplicação falha na inicialização
      # sem esta variável, por desenho. O valor abaixo serve apenas ao compose
      # local — em qualquer ambiente remoto o segredo vem do secret manager.
      JWT_SECRET: ${JWT_SECRET:-local-compose-only-secret-nao-use-fora-daqui}
      REWARDS_WELCOME_ENABLED: "true"
      REWARDS_WELCOME_BONUS: "50"
      REWARDS_ADS_DAILY_LIMIT: "5"
      REWARDS_ADS_BONUS: "20"
    ports:
      - "8080:8080"

volumes:
  brasil_drama_pg:
