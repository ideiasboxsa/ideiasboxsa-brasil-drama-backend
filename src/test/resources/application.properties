# O limite de taxa é por IP e em memória. Nos testes todas as requisições saem
# do mesmo endereço e o Spring reaproveita o contexto entre classes com as mesmas
# propriedades, então os contadores se acumulam: os 10 cadastros espalhados pela
# suíte estourariam o limite de 5/hora e falhariam por 429, não por regressão.
#
# Esta chave existe apenas aqui — não está em application.yml — para não haver
# dúvida de precedência entre os dois arquivos.
brasil-drama.rate-limit.enabled=false

# A retentativa de confirmação de compra roda em thread do agendador. Nos testes
# ela dispararia em paralelo e poluiria a contagem de interações dos mocks do
# GooglePlayVerifier, produzindo falha intermitente sem regressão real.
google.play.acknowledge-retry-enabled=false

