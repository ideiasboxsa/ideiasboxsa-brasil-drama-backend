spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  liquibase:
    contexts: ${LIQUIBASE_CONTEXTS:base,dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

security:
  jwt:
    secret: ${JWT_SECRET}
    ttl: ${JWT_TTL:PT24H}

google:
  oauth:
    # Client ID do tipo *Web application* do projeto GCP brasil-drama. É o mesmo
    # valor que o app passa ao GetSignInWithGoogleOption como serverClientId, e é
    # a audiência esperada no ID token. Sem ele /v1/auth/google devolve 501.
    web-client-id: ${GOOGLE_WEB_CLIENT_ID:}
  play:
    # Service account com acesso à Android Publisher API, em base64. Sem ele a
    # verificação de compra devolve 503 e nenhuma compra é liquidada.
    service-account-json-base64: ${GOOGLE_PLAY_SERVICE_ACCOUNT_B64:}
    package-name: ${GOOGLE_PLAY_PACKAGE_NAME:br.com.brasildrama.app}

admin:
  password-reset:
    ttl: ${ADMIN_PASSWORD_RESET_TTL:PT30M}
    page-url: ${ADMIN_PASSWORD_RESET_PAGE_URL:https://studio-drama-dev.ideiasbox.com/forgot-password}

mailgun:
  api-key: ${MAILGUN_API_KEY:}
  domain: ${MAILGUN_DOMAIN:}
  from: ${MAILGUN_FROM:Brasil Drama <postmaster@mg.ideiaserp.com>}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

rewards:
  zone-id: ${REWARDS_ZONE_ID:America/Sao_Paulo}
  welcome:
    enabled: ${REWARDS_WELCOME_ENABLED:true}
    bonus: ${REWARDS_WELCOME_BONUS:100}
  ads:
    daily-limit: ${REWARDED_AD_DAILY_LIMIT:5}
    bonus: ${REWARDED_AD_BONUS:20}
    session-ttl-minutes: ${REWARDED_AD_SESSION_TTL_MINUTES:10}
    ad-unit-id: ${ADMOB_REWARDED_AD_UNIT_ID:}
