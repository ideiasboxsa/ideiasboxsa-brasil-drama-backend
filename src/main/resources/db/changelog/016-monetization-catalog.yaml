databaseChangeLog:
  - changeSet:
      id: 016-monetization-catalog
      author: brasil-drama
      context: base
      changes:
        - createTable:
            tableName: commercial_product
            columns:
              - column:
                  name: product_id
                  type: varchar(120)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: product_type
                  type: varchar(30)
                  constraints: { nullable: false }
              - column:
                  name: title
                  type: varchar(120)
                  constraints: { nullable: false }
              - column:
                  name: description
                  type: varchar(500)
                  constraints: { nullable: false }
              - column:
                  name: coins
                  type: integer
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
                  constraints: { nullable: false }
              - column:
                  name: display_order
                  type: integer
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints: { nullable: false }
        - sql:
            sql: "ALTER TABLE commercial_product ADD CONSTRAINT ck_commercial_product_type CHECK (product_type IN ('SUBSCRIPTION','COIN_PACK'))"
        - sql:
            sql: "ALTER TABLE commercial_product ADD CONSTRAINT ck_commercial_product_order CHECK (display_order > 0)"
        - insert:
            tableName: commercial_product
            columns:
              - column: { name: product_id, value: brasil_drama_daily }
              - column: { name: product_type, value: SUBSCRIPTION }
              - column: { name: title, value: Plano diário }
              - column: { name: description, value: Acesso Premium Brasil Drama. O preço final é informado pela Google Play. }
              - column: { name: coins, valueNumeric: 0 }
              - column: { name: active, valueBoolean: true }
              - column: { name: display_order, valueNumeric: 1 }
        - insert:
            tableName: commercial_product
