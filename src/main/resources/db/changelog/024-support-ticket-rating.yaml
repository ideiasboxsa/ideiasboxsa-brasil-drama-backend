databaseChangeLog:
  - changeSet:
      id: 024-support-ticket-rating
      author: codex
      context: base
      changes:
        - addColumn:
            tableName: support_ticket
            columns:
              - column:
                  name: rating
                  type: integer
              - column:
                  name: rating_comment
                  type: varchar(1000)
              - column:
                  name: rated_at
                  type: timestamptz
        - sql:
            sql: alter table support_ticket add constraint chk_support_ticket_rating check (rating is null or rating between 1 and 5)
