databaseChangeLog:
  - changeSet:
      id: 011-admin-password-reset-token
      author: openai
      context: base
      changes:
        - createTable:
            tableName: admin_password_reset_token
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: operator_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_admin_password_reset_operator
                    references: admin_operator(id)
              - column:
                  name: token_hash
                  type: varchar(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: expires_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: used_at
                  type: timestamptz
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: admin_password_reset_token
            indexName: idx_admin_password_reset_operator_created
            columns:
              - column: { name: operator_id }
              - column: { name: created_at, descending: true }
