databaseChangeLog:
  - changeSet:
      id: 036-content-analytics
      author: brasil-drama
      changes:
        - createTable:
            tableName: content_event
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
              - column:
                  name: visitor_id
                  type: varchar(64)
              - column:
                  name: session_id
                  type: varchar(120)
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: varchar(40)
                  constraints:
                    nullable: false
              - column:
                  name: surface
                  type: varchar(40)
                  constraints:
                    nullable: false
              - column:
                  name: drama_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: episode_id
                  type: uuid
              - column:
                  name: position_index
                  type: integer
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: content_event
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_content_event_user
            onDelete: SET NULL
        - addForeignKeyConstraint:
            baseTableName: content_event
            baseColumnNames: drama_id
            referencedTableName: drama
            referencedColumnNames: id
            constraintName: fk_content_event_drama
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: content_event
            baseColumnNames: episode_id
            referencedTableName: episode
            referencedColumnNames: id
            constraintName: fk_content_event_episode
            onDelete: CASCADE
        - createIndex:
            tableName: content_event
            indexName: idx_content_event_created
            columns:
              - column:
                  name: created_at
        - createIndex:
            tableName: content_event
            indexName: idx_content_event_surface_created
            columns:
              - column:
                  name: surface
              - column:
                  name: created_at
        - createIndex:
            tableName: content_event
            indexName: idx_content_event_drama_created
            columns:
              - column:
                  name: drama_id
              - column:
                  name: created_at
