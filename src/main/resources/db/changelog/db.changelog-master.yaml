databaseChangeLog:
  - changeSet:
      id: 001-initial-schema
      author: brasil-drama
      changes:
        - createTable:
            tableName: app_user
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: varchar(320)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: display_name
                  type: varchar(120)
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createTable:
            tableName: drama
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: synopsis
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: genre
                  type: varchar(120)
                  constraints:
                    nullable: false
              - column:
                  name: cover_url
                  type: text
        - createTable:
            tableName: episode
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: drama_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_episode_drama
                    references: drama(id)
              - column:
                  name: number
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: coin_price
                  type: integer
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: free
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: video_url
                  type: text
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: episode
            columnNames: drama_id, number
            constraintName: uk_episode_drama_number

  - changeSet:
      id: 002-dev-catalog-seed
      author: brasil-drama
      context: dev
      changes:
        - insert:
            tableName: drama
            columns:
              - column: { name: id, value: "11111111-1111-1111-1111-111111111111" }
              - column: { name: title, value: "Segredo de Família" }
              - column: { name: synopsis, value: "Uma herança inesperada revela um segredo capaz de mudar duas famílias para sempre." }
              - column: { name: genre, value: "Romance" }
        - insert:
            tableName: drama
            columns:
              - column: { name: id, value: "22222222-2222-2222-2222-222222222222" }
              - column: { name: title, value: "Contrato do Destino" }
              - column: { name: synopsis, value: "Um acordo por conveniência transforma rivalidade em uma relação impossível de ignorar." }
              - column: { name: genre, value: "Drama" }
        - insert:
            tableName: episode
            columns:
              - column: { name: id, value: "11111111-1111-1111-1111-111111111101" }
              - column: { name: drama_id, value: "11111111-1111-1111-1111-111111111111" }
              - column: { name: number, valueNumeric: 1 }
              - column: { name: title, value: "A carta" }
              - column: { name: coin_price, valueNumeric: 0 }
              - column: { name: free, valueBoolean: true }
              - column: { name: video_url, value: "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" }
        - insert:
            tableName: episode
            columns:
              - column: { name: id, value: "11111111-1111-1111-1111-111111111102" }
              - column: { name: drama_id, value: "11111111-1111-1111-1111-111111111111" }
              - column: { name: number, valueNumeric: 2 }
              - column: { name: title, value: "O preço da verdade" }
              - column: { name: coin_price, valueNumeric: 30 }
              - column: { name: free, valueBoolean: false }
              - column: { name: video_url, value: "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4" }
        - insert:
            tableName: episode
            columns:
              - column: { name: id, value: "22222222-2222-2222-2222-222222222201" }
              - column: { name: drama_id, value: "22222222-2222-2222-2222-222222222222" }
              - column: { name: number, valueNumeric: 1 }
              - column: { name: title, value: "A proposta" }
              - column: { name: coin_price, valueNumeric: 0 }
              - column: { name: free, valueBoolean: true }
              - column: { name: video_url, value: "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4" }

  - changeSet:
      id: 003-user-credentials-preferences
      author: brasil-drama
      context: base
      changes:
        - addColumn:
            tableName: app_user
            columns:
              - column:
                  name: password_hash
                  type: varchar(100)
              - column:
                  name: autoplay
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: allow_mobile_data
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

  - changeSet:
      id: 004-library-and-playback-history
      author: brasil-drama
      context: base
      changes:
        - createTable:
            tableName: user_favorite
            columns:
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_favorite_user
                    references: app_user(id)
              - column:
                  name: drama_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_favorite_drama
                    references: drama(id)
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: user_favorite
            columnNames: user_id, drama_id
            constraintName: pk_user_favorite
        - createTable:
            tableName: playback_history
            columns:
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_playback_history_user
                    references: app_user(id)
              - column:
                  name: drama_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_playback_history_drama
                    references: drama(id)
              - column:
                  name: episode_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_playback_history_episode
                    references: episode(id)
              - column:
                  name: position_ms
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: duration_ms
                  type: bigint
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: playback_history
            columnNames: user_id, drama_id
            constraintName: pk_playback_history
        - createIndex:
            tableName: playback_history
            indexName: idx_playback_history_user_updated
            columns:
              - column: { name: user_id }
              - column: { name: updated_at, descending: true }
