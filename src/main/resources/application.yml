spring:
  application:
    name: brasil-drama-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/brasil_drama}
    username: ${DB_USER:brasil_drama}
    password: ${DB_PASSWORD:brasil_drama}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    contexts: ${LIQUIBASE_CONTEXTS:base}
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
