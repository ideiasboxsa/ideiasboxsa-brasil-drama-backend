spring:
  application:
    name: brasil-drama-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/brasil_drama}
    username: ${DB_USER:brasil_drama}
    password: ${DB_PASSWORD:brasil_drama}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-root.yaml
    contexts: ${LIQUIBASE_CONTEXTS:base}
server:
  port: ${PORT:8080}
management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
brasil-drama:
  # Limite de taxa por IP nos endpoints públicos. Contagem em memória, por
  # instância: com N instâncias o limite efetivo é N vezes o configurado.
  # Protege contra abuso trivial e cliente defeituoso, não contra ataque
  # distribuído — para esse caso, WAF na borda.
  rate-limit:
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
    register-per-hour: ${RATE_LIMIT_REGISTER_PER_HOUR:5}
    password-reset-per-hour: ${RATE_LIMIT_PASSWORD_RESET_PER_HOUR:5}
    telemetry-per-minute: ${RATE_LIMIT_TELEMETRY_PER_MINUTE:120}
  media:
    bucket: ${MEDIA_BUCKET:brasil-drama-dev-media}
    region: ${AWS_REGION:us-east-1}
    presign-minutes: ${MEDIA_PRESIGN_MINUTES:15}
    read-presign-minutes: ${MEDIA_READ_PRESIGN_MINUTES:60}
    max-image-bytes: ${MEDIA_MAX_IMAGE_BYTES:15728640}
    video-part-bytes: ${MEDIA_VIDEO_PART_BYTES:10485760}
    max-video-bytes: ${MEDIA_MAX_VIDEO_BYTES:2147483648}

info:
  app:
    name: brasil-drama-backend
    commit: ${BUILD_COMMIT:unknown}
